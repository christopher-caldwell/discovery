[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "discovery-cli"
version = "0.1.0"
description = "Deterministic, evidence-backed discovery workflow"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
discovery = "discovery.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
